<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tree Bank Marca</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: una pantalla fija como fondo de presentación. Capas: cielo y montañas (atrás), titular gigante partido, colina con la bóveda y los árboles de Tree Bank (adelante), marco de líneas finas y la fila de datos abajo. */
:root {
  color-scheme: dark;
  --sky-top: #0a2a20;
  --sky-mid: #2a6b55;
  --sky-low: #9cc9b0;
  --forest-950: #04100a;
  --emerald: #10b981;
  --mint: #6ee7b7;
  --mint-soft: #a7f3d0;
  --gold: #f5c451;
  --on-dark: #eef7f2;
  --on-dark-soft: #b4cfc2;
  --line: rgba(220, 245, 232, .18);
  --font-display: 'Anton', 'Oswald', 'Arial Narrow', 'Roboto Condensed', Impact, sans-serif;
  --font-brand: 'Sora', 'Inter', system-ui, sans-serif;
  --font-ui: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; overflow: hidden; background: var(--forest-950); color: var(--on-dark); font-family: var(--font-ui); -webkit-font-smoothing: antialiased; }
#root { height: 100%; }
.stage { position: relative; height: 100%; overflow: hidden; background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-mid) 42%, var(--sky-low) 68%, #2b5a46 100%); }
.layer { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }

/* Animaciones del paisaje */
.cloud { animation: cloud 60s linear infinite; }
.cloud.c2 { animation-duration: 90s; animation-delay: -40s; }
@keyframes cloud { from { transform: translateX(-300px); } to { transform: translateX(1700px); } }
.bird { animation: fly 22s linear infinite; }
.bird.b2 { animation-duration: 26s; animation-delay: -8s; } .bird.b3 { animation-duration: 30s; animation-delay: -15s; }
@keyframes fly { from { transform: translate(-120px, 40px); } to { transform: translate(1560px, -60px); } }
.wing { animation: flap .5s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: center; }
@keyframes flap { to { transform: scaleY(.35); } }
.hill { animation: hillIn 1.4s cubic-bezier(.2, .8, .2, 1) both; }
@keyframes hillIn { from { transform: translateY(80px); opacity: 0; } to { transform: none; opacity: 1; } }
.ptree { transform-box: fill-box; transform-origin: 50% 100%; animation: grow 1.2s cubic-bezier(.2, 1.3, .4, 1) both, sway 6s ease-in-out infinite; }
.ptree.a { animation-delay: 1s, 2.2s; } .ptree.b { animation-delay: 1.25s, 2.6s; } .ptree.c { animation-delay: 1.45s, 3s; }
@keyframes grow { from { transform: scale(0); } 60% { transform: scale(1.05, 1.08); } to { transform: none; } }
@keyframes sway { 50% { transform: rotate(1.6deg); } }
.wheel { transform-box: fill-box; transform-origin: center; animation: turn 24s linear infinite; }
@keyframes turn { to { transform: rotate(360deg); } }
.spark { animation: twinkle 3s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes twinkle { 0%, 100% { opacity: .2; transform: scale(.6); } 50% { opacity: 1; transform: scale(1); } }
.coin-up { animation: coinUp 6s ease-in infinite; transform-box: fill-box; }
@keyframes coinUp { 0% { transform: translateY(0); opacity: 0; } 15% { opacity: 1; } 100% { transform: translateY(-160px); opacity: 0; } }
.glow { animation: glow 4s ease-in-out infinite; }
@keyframes glow { 50% { opacity: .55; } }


.sw { transform-box: fill-box; transform-origin: 50% 100%; animation: sway 8s ease-in-out infinite; }
.f-near .sw { animation-duration: 10s; }
.particles { position: absolute; inset: 0; z-index: 3; pointer-events: none; overflow: hidden; }
.fly { position: absolute; width: 5px; height: 5px; border-radius: 50%; background: #fff3c2; box-shadow: 0 0 10px 3px rgba(255, 228, 140, .6); animation: firefly 9s ease-in-out infinite; }
@keyframes firefly { 0%, 100% { transform: translate(0, 0); opacity: .15; } 30% { opacity: 1; } 50% { transform: translate(30px, -40px); opacity: .8; } 75% { transform: translate(-20px, -10px); opacity: .3; } }
.leaf { position: absolute; top: -5% !important; width: 12px; height: 7px; border-radius: 0 100% 0 100%; background: linear-gradient(135deg, #6ee7b7, #10b981); opacity: .85; animation: fall 12s linear infinite; }
@keyframes fall { from { transform: translate(0, -10vh) rotate(0); } to { transform: translate(-120px, 110vh) rotate(540deg); } }
.spaced { position: absolute; z-index: 5; left: 0; right: 0; top: 27.2%; text-align: center; font-family: var(--font-brand); font-weight: 600; letter-spacing: .9em; text-transform: uppercase; font-size: clamp(.7rem, .55rem + .5vw, 1.05rem); color: rgba(255, 247, 222, .9); margin: 0; animation: fade 1.2s ease 1s both; padding-left: .9em; }

/* Marco y textos */
.frame { position: absolute; inset: 0; z-index: 4; pointer-events: none; }
.frame::before { content: ""; position: absolute; left: 5%; right: 5%; top: 30%; height: 1px; background: var(--line); }
.frame::after { content: ""; position: absolute; left: 5%; right: 5%; top: 30%; bottom: 20%; border-left: 1px solid var(--line); border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.vline { position: absolute; left: 50%; top: 76%; bottom: 20%; width: 1px; background: var(--line); }
.vline::after { content: ""; position: absolute; bottom: -4px; left: -3.5px; width: 8px; height: 8px; border-radius: 50%; background: #fff; box-shadow: 0 0 12px rgba(255, 255, 255, .8); }

.nav { position: absolute; z-index: 6; top: 0; left: 0; right: 0; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 20px; padding: 3.2vh max(16px, 5vw) 0; }
.nav .links { display: flex; gap: 2.4vw; font-size: clamp(.8rem, .7rem + .3vw, 1rem); color: var(--on-dark); opacity: .9; }
.nav .right { display: flex; justify-content: flex-end; align-items: center; gap: 2vw; font-size: clamp(.8rem, .7rem + .3vw, 1rem); }
.wordmark { display: flex; align-items: center; gap: 10px; font-family: var(--font-brand); font-weight: 700; letter-spacing: .32em; font-size: clamp(1rem, .8rem + .8vw, 1.5rem); color: #fff; animation: fade 1s ease .2s both; }
.wordmark svg { width: 1.9em; height: 1.9em; }
.btn-line.ant-btn { height: 46px; padding-inline: 30px; border-radius: 999px; border-color: rgba(255, 255, 255, .75) !important; color: #fff !important; background: rgba(255, 255, 255, .04) !important; font-weight: 500; }
@media (max-width: 760px) { .nav .links, .nav .right .contact { display: none; } .nav { grid-template-columns: 1fr auto; } .nav .left { display: none; } }

.badge-l { position: absolute; z-index: 6; left: max(16px, 5vw); top: 19%; display: flex; align-items: center; gap: 12px; font-size: clamp(.75rem, .65rem + .3vw, .95rem); letter-spacing: .06em; line-height: 1.35; text-transform: uppercase; animation: fade 1s ease .6s both; }
.shield { width: 40px; height: 46px; display: grid; place-items: center; border-radius: 10px 10px 20px 20px; background: linear-gradient(160deg, #1f4d3c, #0a1f16); border: 1px solid rgba(110, 231, 183, .35); color: var(--mint); font-size: 20px; box-shadow: inset 0 0 12px rgba(110, 231, 183, .2); }
.badge-r { position: absolute; z-index: 6; right: max(16px, 5vw); top: 20%; display: flex; gap: 6px; animation: fade 1s ease .7s both; }
.badge-r span { width: 42px; height: 42px; border-radius: 50%; border: 1px solid rgba(255, 255, 255, .7); display: grid; place-items: center; font-size: 18px; color: #fff; }
.badge-r span.t { font-family: var(--font-display); font-size: .78rem; letter-spacing: .02em; }

.headline { position: absolute; z-index: 2; left: 0; right: 0; top: 31%; display: grid; grid-template-columns: 1fr min(15vw, 27vh) 1fr; align-items: start; padding-inline: max(16px, 5vw); white-space: nowrap; font-family: var(--font-display); font-stretch: condensed; font-size: min(9.6vw, 19vh); line-height: .86; letter-spacing: -.005em; text-transform: uppercase; }
.headline span { display: block; background: linear-gradient(180deg, #ffffff 0%, #eaf7f0 45%, rgba(234, 247, 240, .25) 100%); -webkit-background-clip: text; background-clip: text; color: transparent; animation: reveal 1.2s cubic-bezier(.2, .8, .2, 1) both; }
.headline span:first-child { grid-column: 1; justify-self: end; }
.headline span:last-child { grid-column: 3; justify-self: start; animation-delay: .15s; }
@keyframes reveal { from { clip-path: inset(100% 0 0 0); transform: translateY(40px); } to { clip-path: inset(0 0 0 0); transform: none; } }

.open { position: absolute; z-index: 5; left: 50%; top: 70.4%; translate: -50% -50%; width: clamp(64px, 6.4vw, 96px); aspect-ratio: 1; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #ffffff, #dfe9e4 60%, #b9c9c1); color: #10261c; display: grid; place-items: center; font-weight: 600; font-size: clamp(.78rem, .7rem + .3vw, 1rem); box-shadow: 0 12px 30px rgba(0, 0, 0, .45), 0 0 0 6px rgba(255, 255, 255, .12); animation: pulse 3s ease-in-out infinite, fade 1s ease 1.6s both; }
@keyframes pulse { 50% { box-shadow: 0 12px 30px rgba(0, 0, 0, .45), 0 0 0 14px rgba(255, 255, 255, .06); } }

.bottom { position: absolute; z-index: 6; left: 0; right: 0; bottom: 0; display: grid; grid-template-columns: 1fr min(19vw, 300px) 1fr; gap: 24px; align-items: end; padding: 0 max(16px, 5vw) 0; }
.bottom > * { min-width: 0; }
.b-left { padding-bottom: 5vh; display: flex; flex-direction: column; gap: 1.6vh; align-self: end; animation: fade 1s ease 1.8s both; }
.pill-row { display: flex; align-items: center; gap: 28px; }
.pill { border: 1px solid rgba(255, 255, 255, .75); border-radius: 999px; padding: 6px 16px; font-size: clamp(.72rem, .65rem + .25vw, .9rem); letter-spacing: .04em; text-transform: uppercase; }
.dots { display: flex; gap: 6px; } .dots i { width: 8px; height: 8px; border-radius: 50%; border: 1px solid #fff; } .dots i:first-child { background: #fff; }
.stat { display: flex; align-items: center; gap: 14px; }
.stat b { font-family: var(--font-display); font-weight: 400; font-size: min(4.2vw, 8vh); line-height: 1; background: linear-gradient(180deg, #fff, var(--mint)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.stat span { font-size: min(1vw, 2vh); line-height: 1.35; color: var(--on-dark-soft); }
.card-c { align-self: end; height: 21vh; border-radius: 6px 6px 0 0; background: linear-gradient(180deg, rgba(10, 26, 19, .92), rgba(4, 16, 10, .98)); border: 1px solid rgba(255, 255, 255, .1); border-bottom: 0; overflow: hidden; display: flex; flex-direction: column; align-items: center; animation: slideUp 1s cubic-bezier(.2, .8, .2, 1) 2s both; }
.card-c h4 { margin: 0; width: 100%; text-align: center; padding: 12px 0; font-weight: 500; letter-spacing: .06em; font-size: clamp(.75rem, .7rem + .2vw, .9rem); border-bottom: 1px solid rgba(255, 255, 255, .08); }
.phone { width: 40%; margin-top: 1.4vh; aspect-ratio: 9 / 18; border-radius: 16px; padding: 5px; background: linear-gradient(160deg, #2b4a3c, #07150e); box-shadow: 0 0 30px rgba(110, 231, 183, .25); overflow: hidden; animation: float 5s ease-in-out infinite; }
.phone img { width: 100%; height: 100%; object-fit: cover; object-position: top; border-radius: 12px; display: block; }
@keyframes float { 50% { transform: translateY(-6px); } }
@keyframes slideUp { from { transform: translateY(100%); } to { transform: none; } }
.b-right { padding-bottom: calc(5vh + 34px); justify-self: end; align-self: end; max-width: 24ch; animation: fade 1s ease 2.1s both; }
.b-right p { font-size: min(1.55vw, 3vh); line-height: 1.18; font-weight: 400; }
.b-right .hi { color: var(--mint); }
.b-right .chip { display: inline-grid; place-items: center; width: 1.05em; height: 1.05em; border-radius: 5px; background: var(--emerald); color: #04100a; font-size: .62em; vertical-align: .12em; margin-right: .2em; }
.b-right a { display: inline-block; margin-top: 1vh; color: var(--mint); font-size: min(.95vw, 1.9vh); text-underline-offset: 4px; }
@keyframes fade { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
@media (max-width: 760px) {
  .bottom { grid-template-columns: 1fr; height: auto; } .card-c, .b-right { display: none; }
  .headline { display: flex; flex-direction: column; align-items: center; top: 22%; gap: 0; font-size: 19vw; }
  .headline span:first-child, .headline span:last-child { justify-self: auto; }
  .stat b { font-size: 3rem; } .stat span { font-size: .85rem; }
  .spaced { top: 17%; letter-spacing: .5em; }
  .open { top: 73.5%; }
  .badge-r, .badge-l { display: none; }
  .frame::before, .frame::after { display: none; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; } }
</style>

/* Cielo con luz cálida, bosque en capas con niebla, pájaros: detrás del titular */
function pine(x, base, h, w) { const t = []; const n = 5; for (let i = 0; i < n; i++) { const y = base - h + (h * i) / n, ww = w * (0.35 + (0.65 * (i + 1)) / n); t.push(`${x - ww},${y + h / n * 1.25} ${x},${y} ${x + ww},${y + h / n * 1.25}`); } return t; }
function Forest({ trees, fill, cls }) {
  return html`<g className=${cls}>${trees.map(([x, h, w], i) => html`<g key=${i} className="sw" style=${{ animationDelay: -i * 0.7 + 's' }}><rect x=${x - w * 0.06} y=${900 - h * 0.25} width=${w * 0.12} height=${h * 0.3} fill=${fill} />${pine(x, 900 - h * 0.2, h, w).map((p, j) => html`<polygon key=${j} points=${p} fill=${fill} />`)}</g>`)}</g>`;
}
function Back() {
  const far = [[60, 560, 70], [150, 620, 80], [250, 520, 64], [1190, 540, 66], [1290, 640, 84], [1390, 560, 70], [340, 460, 56], [1100, 470, 58]];
  const mid = [[20, 760, 110], [130, 820, 120], [230, 700, 96], [1220, 720, 100], [1330, 840, 124], [1430, 760, 110]];
  const near = [[-30, 980, 170], [90, 1040, 160], [1360, 1000, 170], [1480, 1060, 180]];
  return html`<svg className="layer" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
    <defs>
      <radialGradient id="sun" cx="50%" cy="50%" r="50%"><stop offset="0" stopColor="#fff1c9" stopOpacity=".95" /><stop offset=".35" stopColor="#f5d58a" stopOpacity=".45" /><stop offset="1" stopColor="#f5d58a" stopOpacity="0" /></radialGradient>
      <linearGradient id="fog" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stopColor="#bfe8d6" stopOpacity="0" /><stop offset="1" stopColor="#bfe8d6" stopOpacity=".35" /></linearGradient>
    </defs>
    <circle cx="720" cy="430" r="520" fill="url(#sun)" className="glow" />
    <circle cx="720" cy="430" r="150" fill="#fff4d6" opacity=".22" style=${{ filter: "blur(18px)" }} />
    <${Forest} trees=${far} fill="#5f9f86" cls="f-far" />

    ${[['b1', 640, 200], ['b2', 700, 230], ['b3', 600, 260], ['b1', 760, 180], ['b2', 820, 240]].map(([c, x, y], i) => html`<g key=${i} className=${'bird ' + c} style=${{ animationDelay: -i * 4 + 's' }}><g transform=${`translate(${x - 700} ${y - 200})`}><path className="wing" d="M0 0 Q 7 -6 14 0 Q 21 -6 28 0" fill="none" stroke="#1d4636" strokeWidth="2.6" strokeLinecap="round" /></g></g>`)}
  </svg>`;
}

function Particles() {
  const P = Array.from({ length: 26 }, (_, i) => ({ l: (i * 41 + 3) % 100, t: 30 + (i * 23) % 60, d: -((i * 1.3) % 9), dur: 7 + (i % 5) * 2, leaf: i % 3 === 0 }));
  return html`<div className="particles" aria-hidden="true">${P.map((p, i) => html`<span key=${i} className=${p.leaf ? 'leaf' : 'fly'} style=${{ left: p.l + '%', top: p.t + '%', animationDelay: p.d + 's', animationDuration: p.dur + 's' }}></span>`)}</div>`;
}

      <path d="M865 520 C 850 560, 860 600, 850 630" fill="none" stroke="#2d6e3e" strokeWidth="5" strokeLinecap="round" />
      <!-- árboles de Tree Bank sobre la colina -->
      <g className="ptree b"><polygon points="612,478 650,382 688,478" fill="url(#pine2)" /><polygon points="618,440 650,352 682,440" fill="url(#pine2)" /><rect x="644" y="476" width="12" height="18" rx="3" fill="#2f5a3f" /></g>
      <g className="ptree c"><polygon points="752,478 790,382 828,478" fill="url(#pine2)" /><polygon points="758,440 790,352 822,440" fill="url(#pine2)" /><rect x="784" y="476" width="12" height="18" rx="3" fill="#2f5a3f" /></g>

        <circle cx="720" cy="286" r="15" fill="url(#cg)" /><text x="720" y="292.5" textAnchor="middle" fontFamily="Sora, sans-serif" fontWeight="800" fontSize="17" fill="#8a6408">$</text></g>
      ${coins.map(([x, y, d], i) => html`<g key=${i} className="coin-up" style=${{ animationDelay: d + 's' }}><circle cx=${x} cy=${y} r="9" fill="url(#cg)" /><text x=${x} y=${y + 4} textAnchor="middle" fontFamily="Sora, sans-serif" fontWeight="800" fontSize="11" fill="#8a6408">$</text></g>`)}
      ${[[560, 430], [890, 420], [720, 250], [500, 560], [960, 540]].map(([x, y], i) => html`<path key=${i} className="spark" style=${{ animationDelay: i * 0.6 + 's' }} d=${`M${x} ${y - 8} L${x + 2} ${y - 2} L${x + 8} ${y} L${x + 2} ${y + 2} L${x} ${y + 8} L${x - 2} ${y + 2} L${x - 8} ${y} L${x - 2} ${y - 2} Z`} fill="#fff4c4" />`)}
    </g></g>
    <rect x="0" y="720" width="1440" height="180" fill="url(#shade)" />
  </svg>`;
}
