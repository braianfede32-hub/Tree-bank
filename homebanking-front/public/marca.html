<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tree Bank Marca</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Sora:wght@600;700;800&display=swap">
<style>
/* Layout: una sola ilustración a pantalla completa. Todo vive en un SVG por capas (cielo, rayos, bosques, titular, colina con bóveda, primer plano) para que el titular quede encastrado detrás de la colina en cualquier pantalla. Encima, solo el logo y las partículas. */
:root {
  color-scheme: dark;
  --forest-950: #04100a;
  --mint: #6ee7b7;
  --mint-soft: #a7f3d0;
  --emerald: #10b981;
  --gold: #f5c451;
  --cream: #fff1d6;
  --font-display: 'Anton', 'Oswald', 'Arial Narrow', 'Roboto Condensed', Impact, sans-serif;
  --font-brand: 'Sora', 'Inter', system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; overflow: hidden; background: var(--forest-950); color: #fff; font-family: var(--font-brand); -webkit-font-smoothing: antialiased; }
#root { height: 100%; }
.stage { position: relative; height: 100%; overflow: hidden; background: var(--forest-950); --mx: 0; --my: 0; }
.scene { position: absolute; inset: 0; width: 100%; height: 100%; animation: camera 3.2s cubic-bezier(.2, .7, .1, 1) both; transform-origin: 50% 62%; }
@keyframes camera { from { transform: scale(1.14); filter: brightness(.6); } to { transform: none; filter: none; } }

/* Parallax: cada capa se mueve según su profundidad */
.px { transition: transform .9s cubic-bezier(.2, .7, .2, 1); transform: translate(calc(var(--mx) * var(--k) * 1px), calc(var(--my) * var(--k) * .6px)); }

/* Cielo y luz */
.rays { transform-box: view-box; transform-origin: 720px 470px; animation: rays 14s ease-in-out infinite; }
@keyframes rays { 0%, 100% { transform: rotate(-2.5deg); opacity: .85; } 50% { transform: rotate(2.5deg); opacity: 1; } }
.sunpulse { animation: sunpulse 6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes sunpulse { 50% { opacity: .75; transform: scale(1.04); } }
.fogdrift { animation: fog 26s ease-in-out infinite; }
.fogdrift.f2 { animation-duration: 34s; animation-direction: reverse; }
@keyframes fog { 50% { transform: translateX(-60px); } }
.far { filter: blur(1.6px); }
.sway { transform-box: fill-box; transform-origin: 50% 100%; animation: sway 8s ease-in-out infinite; }
@keyframes sway { 50% { transform: rotate(1.2deg); } }
.bird { animation: fly 24s linear infinite; }
@keyframes fly { from { transform: translate(-200px, 60px); } to { transform: translate(1700px, -80px); } }
.wing { animation: flap .45s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: center; }
@keyframes flap { to { transform: scaleY(.3); } }

/* Titular dentro de la escena */
.word { font-family: var(--font-display); letter-spacing: -1px; animation: rise 1.3s cubic-bezier(.2, .8, .2, 1) both; }
.word.w2 { animation-delay: .18s; }
@keyframes rise { from { transform: translateY(70px); opacity: 0; } to { transform: none; opacity: 1; } }
.spaced { font-family: var(--font-brand); font-weight: 600; letter-spacing: 16px; text-transform: uppercase; animation: fade 1.4s ease 1s both; }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }

/* Colina, bóveda y árboles de Tree Bank */
.hill-in { animation: hillIn 1.6s cubic-bezier(.2, .8, .2, 1) .2s both; }
@keyframes hillIn { from { transform: translateY(120px); } to { transform: none; } }
.ptree { transform-box: fill-box; transform-origin: 50% 100%; animation: grow 1.3s cubic-bezier(.2, 1.3, .4, 1) both, sway 6s ease-in-out infinite; }
.ptree.a { animation-delay: 1.1s, 2.4s; } .ptree.b { animation-delay: 1.35s, 2.8s; } .ptree.c { animation-delay: 1.5s, 3.2s; }
@keyframes grow { from { transform: scale(0); } 60% { transform: scale(1.05, 1.08); } to { transform: none; } }
.wheel { transform-box: fill-box; transform-origin: center; animation: turn 30s linear infinite; }
@keyframes turn { to { transform: rotate(360deg); } }
.coin-up { animation: coinUp 7s ease-in infinite; }
@keyframes coinUp { 0% { transform: translateY(0); opacity: 0; } 15% { opacity: 1; } 100% { transform: translateY(-200px); opacity: 0; } }
.spark { animation: twinkle 3s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes twinkle { 0%, 100% { opacity: .1; transform: scale(.5); } 50% { opacity: 1; transform: scale(1); } }
.shine { animation: shine 5s ease-in-out infinite; }
@keyframes shine { 0%, 100% { opacity: .25; } 50% { opacity: .7; } }
.fore { filter: blur(2.2px); }
.fern { transform-box: fill-box; transform-origin: 50% 100%; animation: sway 7s ease-in-out infinite; }

/* Capa HTML */
.wordmark { position: absolute; z-index: 5; top: max(3.4vh, env(safe-area-inset-top, 0px)); left: 50%; translate: -50% 0; display: flex; align-items: center; gap: 12px; font-weight: 700; letter-spacing: .34em; font-size: clamp(1rem, .8rem + .8vw, 1.5rem); color: #fff; animation: fade 1.2s ease .4s both; white-space: nowrap; }
.wordmark svg { width: 1.9em; height: 1.9em; }
.particles { position: absolute; inset: 0; z-index: 4; pointer-events: none; overflow: hidden; }
.fly { position: absolute; width: 5px; height: 5px; border-radius: 50%; background: #fff3c2; box-shadow: 0 0 12px 4px rgba(255, 214, 120, .55); animation: firefly 9s ease-in-out infinite; }
@keyframes firefly { 0%, 100% { transform: translate(0, 0); opacity: .1; } 30% { opacity: 1; } 50% { transform: translate(30px, -40px); opacity: .8; } 75% { transform: translate(-20px, -10px); opacity: .25; } }
.leaf { position: absolute; top: -5%; width: 13px; height: 7px; border-radius: 0 100% 0 100%; background: linear-gradient(135deg, #f5c451, #e08a3c); opacity: .85; animation: fall 13s linear infinite; }
.leaf.g { background: linear-gradient(135deg, #6ee7b7, #10b981); }
@keyframes fall { from { transform: translate(0, -10vh) rotate(0); } to { transform: translate(-140px, 112vh) rotate(560deg); } }
.vignette { position: absolute; inset: 0; z-index: 3; pointer-events: none; background: radial-gradient(ellipse 85% 75% at 50% 52%, transparent 55%, rgba(2, 10, 6, .55) 100%); }

/* Celular: titular en HTML arriba, porque la escena se recorta a lo ancho */
.m-head { display: none; }
@media (max-aspect-ratio: 1/1) {
  .in-scene-text { display: none; }
  .m-head { display: block; position: absolute; z-index: 4; left: 0; right: 0; top: 13%; text-align: center; padding-inline: max(16px, env(safe-area-inset-left, 0px)); }
  .m-head p { font-family: var(--font-brand); font-weight: 600; letter-spacing: .5em; font-size: .72rem; color: var(--cream); margin: 0 0 10px; padding-left: .5em; animation: fade 1.4s ease 1s both; }
  .m-head h1 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 19vw; line-height: .9; text-transform: uppercase; background: linear-gradient(180deg, #fff 30%, rgba(255, 241, 214, .35)); -webkit-background-clip: text; background-clip: text; color: transparent; animation: rise 1.3s cubic-bezier(.2, .8, .2, 1) both; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>


<div id="root"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dayjs@1.11.13/dayjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/antd@5.21.6/dist/antd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.umd.js"></script>
<script>
(function () {
const { useEffect, useRef } = React;
const html = htm.bind(React.createElement);
const { ConfigProvider, theme } = antd;

/* Generador determinístico (misma escena en cada carga) */
function rng(seed) { let s = seed; return () => { s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; }; }

/* Pino con ramas irregulares: silueta orgánica en lugar de triángulos */
function pinePath(x, base, h, w, seed) {
  const r = rng(seed), tiers = 8, step = (h * 0.9) / tiers, right = [], left = [];
  for (let i = 0; i < tiers; i++) {
    const y = base - h + step * (i + 1);
    const hw = (w / 2) * Math.pow((i + 1) / tiers, 0.85) * (0.9 + r() * 0.2);
    const droop = step * (0.25 + r() * 0.2);
    right.push(`${(x + hw).toFixed(1)},${(y + droop).toFixed(1)}`, `${(x + hw * (0.35 + r() * 0.15)).toFixed(1)},${(y - step * 0.12).toFixed(1)}`);
    left.push(`${(x - hw * (0.35 + r() * 0.15)).toFixed(1)},${(y - step * 0.12).toFixed(1)}`, `${(x - hw * (0.95 + r() * 0.1)).toFixed(1)},${(y + droop).toFixed(1)}`);
  }
  const tw = Math.max(3, w * 0.06);
  return `M${x},${base - h} L${right.join(' L')} L${x + tw},${base - h * 0.08} L${x + tw},${base} L${x - tw},${base} L${x - tw},${base - h * 0.08} L${left.reverse().join(' L')} Z`;
}

function Forest({ trees, fill, seed, cls }) {
  return html`<g className=${cls}>${trees.map(([x, base, h, w], i) => html`<path key=${i} className="sway" style=${{ animationDelay: -i * 0.9 + 's', animationDuration: 7 + (i % 4) + 's' }} d=${pinePath(x, base, h, w, seed + i * 31)} fill=${typeof fill === 'function' ? fill(x) : fill} />`)}</g>`;
}

/* Helecho de primer plano: hojitas a los dos lados de un tallo curvo */
function Fern({ x, base, h, dir, i }) {
  const n = 14, items = [];
  for (let k = 1; k <= n; k++) {
    const t = k / n, cx = x + dir * h * 0.5 * t * t, cy = base - h * t;
    const ang = Math.atan2(-h, dir * h * t) * 180 / Math.PI;
    const len = h * 0.13 * (1 - t * 0.75);
    [1, -1].forEach((side) => items.push(html`<ellipse key=${k + '' + side} cx=${cx} cy=${cy} rx=${len} ry=${len * 0.32} transform=${`rotate(${ang + side * 62} ${cx} ${cy}) translate(${len * 0.8} 0)`} fill="#061a10" />`));
  }
  return html`<g className="fern" style=${{ animationDelay: -i + 's' }}><path d=${`M${x},${base} Q ${x + dir * h * 0.12},${base - h * 0.5} ${x + dir * h * 0.5},${base - h}`} fill="none" stroke="#061a10" strokeWidth="5" strokeLinecap="round" />${items}</g>`;
}

function Coin({ x, y, r = 9 }) {
  return html`<g><circle cx=${x} cy=${y} r=${r} fill="url(#coin)" /><circle cx=${x - r * .3} cy=${y - r * .35} r=${r * .28} fill="#fffbe6" opacity=".55" /><text x=${x} y=${y + r * .42} textAnchor="middle" fontFamily="Sora, sans-serif" fontWeight="800" fontSize=${r * 1.15} fill="#8a6408">$</text></g>`;
}

function Defs() {
  return html`<defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stopColor="#071f19" /><stop offset=".28" stopColor="#174a3c" /><stop offset=".46" stopColor="#5d8f73" />
      <stop offset=".56" stopColor="#e8c387" /><stop offset=".62" stopColor="#f0b978" /><stop offset=".7" stopColor="#7a8f5c" /><stop offset="1" stopColor="#0c2418" />
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%"><stop offset="0" stopColor="#fff7e2" /><stop offset=".18" stopColor="#ffe2a8" stopOpacity=".95" /><stop offset=".45" stopColor="#f5b26b" stopOpacity=".38" /><stop offset="1" stopColor="#f5b26b" stopOpacity="0" /></radialGradient>
    <linearGradient id="ray" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stopColor="#fff1c9" stopOpacity=".55" /><stop offset="1" stopColor="#fff1c9" stopOpacity="0" /></linearGradient>
    <linearGradient id="fog" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stopColor="#f6dcb0" stopOpacity="0" /><stop offset=".6" stopColor="#d9e8c9" stopOpacity=".42" /><stop offset="1" stopColor="#d9e8c9" stopOpacity="0" /></linearGradient>
    <linearGradient id="litL" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stopColor="#2c6551" /><stop offset=".78" stopColor="#3e7a5e" /><stop offset="1" stopColor="#e6b878" /></linearGradient>
    <linearGradient id="litR" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stopColor="#e6b878" /><stop offset=".22" stopColor="#3e7a5e" /><stop offset="1" stopColor="#2c6551" /></linearGradient>
    <linearGradient id="meadow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stopColor="#8aa863" /><stop offset=".35" stopColor="#3f7046" /><stop offset="1" stopColor="#0d2a1a" /></linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stopColor="#ffffff" /><stop offset=".55" stopColor="#fff4de" /><stop offset="1" stopColor="#ffe9bf" stopOpacity=".55" /></linearGradient>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stopColor="#7fb35b" /><stop offset=".25" stopColor="#4a8a44" /><stop offset=".7" stopColor="#24552e" /><stop offset="1" stopColor="#0d2717" /></linearGradient>
    <linearGradient id="rimgold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stopColor="#ffd98f" /><stop offset="1" stopColor="#ffd98f" stopOpacity="0" /></linearGradient>
    <linearGradient id="rock" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stopColor="#b9b6a3" /><stop offset=".5" stopColor="#7b8178" /><stop offset="1" stopColor="#3d4640" /></linearGradient>
    <linearGradient id="bevel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stopColor="#f2f6ef" /><stop offset=".35" stopColor="#9fb2a7" /><stop offset=".7" stopColor="#56695f" /><stop offset="1" stopColor="#2b3832" /></linearGradient>
    <radialGradient id="steel" cx="38%" cy="32%" r="75%"><stop offset="0" stopColor="#dbe6df" /><stop offset=".5" stopColor="#8fa69a" /><stop offset="1" stopColor="#3e544a" /></radialGradient>
    <radialGradient id="hub" cx="40%" cy="35%" r="65%"><stop offset="0" stopColor="#eef4f0" /><stop offset="1" stopColor="#6c8679" /></radialGradient>
    <linearGradient id="pine1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stopColor="#9ff0cc" /><stop offset=".45" stopColor="#3fd29a" /><stop offset="1" stopColor="#0b7a52" /></linearGradient>
    <linearGradient id="pine2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stopColor="#5ee0a8" /><stop offset="1" stopColor="#0a6646" /></linearGradient>
    <radialGradient id="coin" cx="40%" cy="35%" r="70%"><stop offset="0" stopColor="#fff1b8" /><stop offset=".45" stopColor="#f5c451" /><stop offset="1" stopColor="#b8860b" /></radialGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stopColor="#04100a" stopOpacity="0" /><stop offset="1" stopColor="#04100a" stopOpacity=".9" /></linearGradient>
  </defs>`;
}

function Scene() {
  const far = [[80, 640, 300, 90], [170, 650, 360, 100], [260, 640, 280, 80], [350, 650, 230, 70], [1090, 650, 240, 72], [1180, 640, 300, 86], [1270, 650, 350, 98], [1370, 640, 290, 84], [440, 660, 170, 52], [1010, 660, 180, 54]];
  const mid = [[30, 760, 560, 160], [150, 770, 650, 170], [270, 760, 470, 130], [1170, 760, 480, 132], [1290, 770, 640, 168], [1410, 760, 560, 158]];
  const near = [[-90, 930, 1060, 250], [20, 950, 860, 200], [1420, 950, 880, 204], [1530, 930, 1080, 254]];
  const rays = [[-62, 260], [-38, 200], [-18, 300], [4, 230], [24, 280], [44, 210], [64, 250]];
  const leaves = [[600, 572], [636, 548], [676, 534], [720, 528], [764, 534], [806, 548], [842, 572]];
  const coins = [[640, 690, 0], [810, 650, 2.2], [720, 600, 4.1], [770, 760, 1.3], [672, 770, 3.4]];
  const blades = Array.from({ length: 70 }, (_, i) => { const t = i / 69, x = 470 + t * 500, y = 520 + Math.pow((t - .5) * 2, 2) * 150; return [x, y, 10 + (i * 7) % 14, (i % 2 ? 1 : -1) * (2 + (i * 3) % 5)]; });
  const flowers = Array.from({ length: 40 }, (_, i) => [((i * 97) % 1440), 845 + (i * 13) % 50, i % 3]);
  return html`<svg className="scene" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMax slice" role="img" aria-label="Tree Bank: titular Tu plata crece, una bóveda en una colina con tres árboles y una moneda, en un bosque al atardecer">
    <${Defs} />
    <rect x="-200" y="-200" width="1840" height="1300" fill="url(#sky)" />
    <g className="px" style=${{ '--k': 2 }}>
      <circle className="sunpulse" cx="720" cy="470" r="460" fill="url(#sun)" />
      <g className="rays" style=${{ mixBlendMode: 'screen' }}>${rays.map(([a, len], i) => html`<polygon key=${i} points=${`720,470 ${720 + 1100 * Math.cos((a - 90 - 3) * Math.PI / 180)},${470 + 1100 * Math.sin((a - 90 - 3) * Math.PI / 180)} ${720 + 1100 * Math.cos((a - 90 + 3) * Math.PI / 180)},${470 + 1100 * Math.sin((a - 90 + 3) * Math.PI / 180)}`} fill="url(#ray)" opacity=${0.18 + (i % 3) * 0.06} />`)}</g>
    </g>
    ${[[0, 640, 230], [-12, 690, 255], [-6, 610, 280]].map(([d, x, y], i) => html`<g key=${i} className="bird" style=${{ animationDelay: d - i * 5 + 's' }}><g transform=${`translate(${x - 700} ${y - 200})`}><path className="wing" d="M0 0 Q 7 -6 14 0 Q 21 -6 28 0" fill="none" stroke="#2a3b2c" strokeWidth="2.6" strokeLinecap="round" /></g></g>`)}
    <g className="px far" style=${{ '--k': 4 }}><${Forest} trees=${far} fill="#a9c9a6" seed=${3} /></g>
    <g className="px" style=${{ '--k': 5 }}><path d="M-100 700 C 200 640, 500 680, 720 660 C 960 640, 1240 690, 1540 650 L1540 900 L-100 900 Z" fill="url(#meadow)" /></g>
    <rect className="fogdrift" x="-200" y="520" width="1840" height="260" fill="url(#fog)" />
    <g className="px" style=${{ '--k': 8 }}><${Forest} trees=${mid} fill=${(x) => (x < 720 ? 'url(#litL)' : 'url(#litR)')} seed=${11} /></g>
    <rect className="fogdrift f2" x="-200" y="640" width="1840" height="200" fill="url(#fog)" opacity=".8" />

    <g className="px in-scene-text" style=${{ '--k': 10 }}>
      <text className="spaced" x="720" y="300" textAnchor="middle" fontSize="17" fill="#fff1d6">Sembrá · Ahorrá · Crecé</text>
      <text className="word" x="590" y="648" textAnchor="end" fontSize="156" fill="url(#word)">TU PLATA</text>
      <text className="word w2" x="852" y="648" textAnchor="start" fontSize="156" fill="url(#word)">CRECE</text>
    </g>

    <g className="px" style=${{ '--k': 13 }}><g className="hill-in"><g transform="translate(720 940) scale(.86) translate(-720 -940)">
      <path d="M300 940 C 360 720, 520 560, 720 545 C 920 560, 1080 720, 1140 940 Z" fill="url(#grass)" />
      <path d="M520 590 C 600 552, 840 552, 920 590" fill="none" stroke="url(#rimgold)" strokeWidth="6" opacity=".55" className="shine" />
      ${blades.map(([x, y, h, lean], i) => html`<path key=${i} d=${`M${x - 3},${y + 4} Q ${x + lean},${y - h * .6} ${x + lean * 1.5},${y - h} Q ${x + lean * .4},${y - h * .4} ${x + 3},${y + 4} Z`} fill=${i % 3 ? '#5f9f4c' : '#86bd5e'} />`)}
      <path d="M350 900 L 400 760 L 470 700 L 540 730 L 500 820 L 470 900 Z" fill="url(#rock)" />
      <path d="M400 760 L 470 700 L 490 740 Z" fill="#d9d4bd" opacity=".45" />
      <path d="M1090 900 L 1040 770 L 975 715 L 905 745 L 950 830 L 975 900 Z" fill="url(#rock)" />
      <path d="M1040 770 L 975 715 L 960 750 Z" fill="#d9d4bd" opacity=".35" />
      <path d="M540 620 L 590 588 L 630 604 L 600 640 Z" fill="url(#rock)" />
      <path d="M880 610 L 925 640 L 905 676 L 862 650 Z" fill="url(#rock)" />
      <circle cx="720" cy="735" r="178" fill="#1e2b25" />
      <circle cx="720" cy="735" r="170" fill="url(#bevel)" />
      <circle cx="720" cy="735" r="152" fill="url(#steel)" stroke="#33463d" strokeWidth="3" />
      <circle cx="720" cy="735" r="120" fill="none" stroke="#5e776a" strokeWidth="3" opacity=".8" />
      <path d="M612 640 A 152 152 0 0 1 830 630" fill="none" stroke="#ffffff" strokeWidth="5" strokeLinecap="round" opacity=".35" className="shine" />
      ${[0, 45, 90, 135, 180, 225, 270, 315].map((a) => { const x = 720 + 162 * Math.cos(a * Math.PI / 180), y = 735 + 162 * Math.sin(a * Math.PI / 180); return html`<g key=${a}><circle cx=${x} cy=${y} r="7" fill="#4f665b" /><circle cx=${x - 2} cy=${y - 2} r="2.5" fill="#dfe8e2" opacity=".6" /></g>`; })}
      <rect x="878" y="690" width="30" height="90" rx="10" fill="url(#bevel)" stroke="#2b3b34" strokeWidth="2" />
      <rect x="882" y="705" width="22" height="10" rx="3" fill="#3e544a" /><rect x="882" y="755" width="22" height="10" rx="3" fill="#3e544a" />
      <g className="wheel">
        ${[0, 60, 120].map((a) => html`<rect key=${a} x="598" y="729" width="244" height="12" rx="6" fill="#e3ebe6" stroke="#4a6257" strokeWidth="2" transform=${`rotate(${a} 720 735)`} />`)}
        ${[0, 60, 120, 180, 240, 300].map((a) => { const x = 720 + 122 * Math.cos(a * Math.PI / 180), y = 735 + 122 * Math.sin(a * Math.PI / 180); return html`<circle key=${a} cx=${x} cy=${y} r="9" fill="#f2f6f3" stroke="#4a6257" strokeWidth="2" />`; })}
        <circle cx="720" cy="735" r="58" fill="url(#hub)" stroke="#4a6257" strokeWidth="3" />
        <circle cx="720" cy="735" r="24" fill="#5c7a6b" />
      </g>
      ${leaves.map(([x, y], i) => html`<g key=${i}><ellipse cx=${x} cy=${y} rx="18" ry="11" fill=${i % 2 ? '#3f8a4f' : '#2d6e3e'} /><ellipse cx=${x + 12} cy=${y + 9} rx="11" ry="7" fill="#5fae62" /></g>`)}
      ${[[566, 600, 40], [590, 640, 50], [874, 600, 46], [856, 650, 40]].map(([x, y, l], i) => html`<path key=${i} d=${`M${x},${y} q ${i < 2 ? 10 : -10},${l / 2} 0,${l}`} fill="none" stroke="#3f8a4f" strokeWidth="5" strokeLinecap="round" />`)}
      <g className="ptree b"><path d=${pinePath(632, 560, 190, 92, 71)} fill="url(#pine2)" /></g>
      <g className="ptree c"><path d=${pinePath(808, 560, 190, 92, 83)} fill="url(#pine2)" /></g>
      <g className="ptree a"><path d=${pinePath(720, 556, 260, 118, 97)} fill="url(#pine1)" /><${Coin} x=${720} y=${282} r=${17} /></g>
      ${coins.map(([x, y, d], i) => html`<g key=${i} className="coin-up" style=${{ animationDelay: d + 's' }}><${Coin} x=${x} y=${y} r=${9} /></g>`)}
      ${[[560, 470], [880, 450], [720, 236], [500, 620], [950, 610], [650, 380]].map(([x, y], i) => html`<path key=${i} className="spark" style=${{ animationDelay: i * 0.55 + 's' }} d=${`M${x} ${y - 9} L${x + 2} ${y - 2} L${x + 9} ${y} L${x + 2} ${y + 2} L${x} ${y + 9} L${x - 2} ${y + 2} L${x - 9} ${y} L${x - 2} ${y - 2} Z`} fill="#fff4c4" />`)}
    </g></g></g>

    <g className="px" style=${{ '--k': 18 }}><${Forest} trees=${near} fill="#061a10" seed=${41} /></g>
    <rect x="-200" y="740" width="1840" height="200" fill="url(#shade)" />
    <g className="px fore" style=${{ '--k': 26 }}>
      ${flowers.map(([x, y, c], i) => html`<circle key=${i} cx=${x} cy=${y} r=${2.5 + c} fill=${c === 0 ? '#f5c451' : c === 1 ? '#f0a46b' : '#fff1d6'} opacity=".85" />`)}
      ${[[40, 905, 260, 1], [130, 915, 200, 1], [-20, 915, 300, 1], [1400, 905, 270, -1], [1310, 915, 210, -1], [1460, 915, 300, -1]].map(([x, b, h, d], i) => html`<${Fern} key=${i} x=${x} base=${b} h=${h} dir=${d} i=${i} />`)}
      <path d="M-100 900 Q 200 850, 420 880 T 900 875 T 1540 870 L1540 960 L-100 960 Z" fill="#051309" />
    </g>
  </svg>`;
}

function Mark() {
  return html`<svg viewBox="0 0 100 100" aria-hidden="true"><defs><linearGradient id="wm" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse"><stop stopColor="#a7f3d0" /><stop offset="1" stopColor="#10b981" /></linearGradient></defs>
    <polygon points="18,72 30,40 42,72" fill="url(#wm)" opacity=".8" /><polygon points="20,60 30,30 40,60" fill="url(#wm)" opacity=".8" />
    <polygon points="35,75 50,32 65,75" fill="url(#wm)" /><polygon points="37,62 50,22 63,62" fill="url(#wm)" />
    <polygon points="58,72 70,40 82,72" fill="url(#wm)" opacity=".8" /><polygon points="60,60 70,30 80,60" fill="url(#wm)" opacity=".8" />
    <rect x="12" y="84" width="76" height="4" rx="2" fill="url(#wm)" /></svg>`;
}

function Particles() {
  const P = Array.from({ length: 30 }, (_, i) => ({ l: (i * 41 + 3) % 100, t: 25 + (i * 23) % 65, d: -((i * 1.3) % 11), dur: 8 + (i % 5) * 2, kind: i % 4 === 0 ? 'leaf' : i % 4 === 1 ? 'leaf g' : 'fly' }));
  return html`<div className="particles" aria-hidden="true">${P.map((p, i) => html`<span key=${i} className=${p.kind} style=${{ left: p.l + '%', top: p.kind === 'fly' ? p.t + '%' : undefined, animationDelay: p.d + 's', animationDuration: p.dur + 's' }}></span>`)}</div>`;
}

function App() {
  const ref = useRef(null);
  useEffect(() => {
    const el = ref.current; if (!el) return;
    if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const onMove = (e) => { el.style.setProperty('--mx', ((e.clientX / innerWidth) - 0.5) * -2); el.style.setProperty('--my', ((e.clientY / innerHeight) - 0.5) * -2); };
    addEventListener('pointermove', onMove);
    return () => removeEventListener('pointermove', onMove);
  }, []);
  return html`<${ConfigProvider} theme=${{ algorithm: theme.darkAlgorithm, token: { colorPrimary: '#10b981' } }}>
    <main className="stage" ref=${ref}>
      <${Scene} />
      <div className="vignette"></div>
      <${Particles} />
      <div className="wordmark"><${Mark} />TREE BANK</div>
      <div className="m-head"><p>Sembrá · Ahorrá · Crecé</p><h1>Tu plata<br />crece</h1></div>
    </main>
  </${ConfigProvider}>`;
}

ReactDOM.createRoot(document.getElementById('root')).render(html`<${App} />`);
})();
</script>

</body>
</html>
