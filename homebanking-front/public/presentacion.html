<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tree Bank Presentación</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: presentación de 10 diapositivas sobre un lienzo fijo de 1600x900 que se escala a la ventana. Portada y cierre usan la escena del bosque; el resto, fondo de bosque oscuro con luz dorada y contenido en componentes de Ant Design. */
:root {
  color-scheme: dark;
  --forest-950: #04100a;
  --forest-900: #0a2117;
  --forest-850: #0d291d;
  --forest-800: #113324;
  --emerald: #10b981;
  --mint: #6ee7b7;
  --mint-soft: #a7f3d0;
  --gold: #f5c451;
  --gold-soft: #ffe2a8;
  --cream: #fff1d6;
  --on-dark: #e8f4ed;
  --on-dark-soft: #a3bfb1;
  --line: rgba(167, 243, 208, .14);
  --font-display: 'Anton', 'Oswald', 'Arial Narrow', 'Roboto Condensed', Impact, sans-serif;
  --font-brand: 'Sora', 'Inter', system-ui, sans-serif;
  --font-ui: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; overflow: hidden; background: #020805; color: var(--on-dark); font-family: var(--font-ui); -webkit-font-smoothing: antialiased; }
#root { height: 100%; }
.viewport { position: fixed; inset: 0; overflow: hidden; background: #020805; }
.canvas { position: absolute; left: 50%; top: 50%; width: 1600px; height: 900px; overflow: hidden; background: var(--forest-950); transform-origin: center; border-radius: 6px; box-shadow: 0 0 0 1px rgba(167, 243, 208, .06); }
.slide { position: absolute; inset: 0; --mx: 0; --my: 0; }

.scene { position: absolute; inset: 0; width: 100%; height: 100%; animation: camera 3.2s cubic-bezier(.2, .7, .1, 1) both; transform-origin: 50% 62%; }
@keyframes camera { from { transform: scale(1.14); filter: brightness(.6); } to { transform: none; filter: none; } }

/* Parallax: cada capa se mueve según su profundidad */
.px { transition: transform .9s cubic-bezier(.2, .7, .2, 1); transform: translate(calc(var(--mx) * var(--k) * 1px), calc(var(--my) * var(--k) * .6px)); }

/* Cielo y luz */
.rays { transform-box: view-box; transform-origin: 720px 470px; animation: rays 14s ease-in-out infinite; }
@keyframes rays { 0%, 100% { transform: rotate(-2.5deg); opacity: .85; } 50% { transform: rotate(2.5deg); opacity: 1; } }
.sunpulse { animation: sunpulse 6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes sunpulse { 50% { opacity: .75; transform: scale(1.04); } }
.fogdrift { animation: fog 26s ease-in-out infinite; }
.fogdrift.f2 { animation-duration: 34s; animation-direction: reverse; }
@keyframes fog { 50% { transform: translateX(-60px); } }
.far { filter: blur(1.6px); }
.sway { transform-box: fill-box; transform-origin: 50% 100%; animation: sway 8s ease-in-out infinite; }
@keyframes sway { 50% { transform: rotate(1.2deg); } }
.bird { animation: fly 24s linear infinite; }
@keyframes fly { from { transform: translate(-200px, 60px); } to { transform: translate(1700px, -80px); } }
.wing { animation: flap .45s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: center; }
@keyframes flap { to { transform: scaleY(.3); } }

/* Titular dentro de la escena */
.word { font-family: var(--font-display); letter-spacing: -1px; animation: rise 1.3s cubic-bezier(.2, .8, .2, 1) both; }
.word.w2 { animation-delay: .18s; }
@keyframes rise { from { transform: translateY(70px); opacity: 0; } to { transform: none; opacity: 1; } }
.spaced { font-family: var(--font-brand); font-weight: 600; letter-spacing: 16px; text-transform: uppercase; animation: fade 1.4s ease 1s both; }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }

/* Colina, bóveda y árboles de Tree Bank */
.hill-in { animation: hillIn 1.6s cubic-bezier(.2, .8, .2, 1) .2s both; }
@keyframes hillIn { from { transform: translateY(120px); } to { transform: none; } }
.ptree { transform-box: fill-box; transform-origin: 50% 100%; animation: grow 1.3s cubic-bezier(.2, 1.3, .4, 1) both, sway 6s ease-in-out infinite; }
.ptree.a { animation-delay: 1.1s, 2.4s; } .ptree.b { animation-delay: 1.35s, 2.8s; } .ptree.c { animation-delay: 1.5s, 3.2s; }
@keyframes grow { from { transform: scale(0); } 60% { transform: scale(1.05, 1.08); } to { transform: none; } }
.wheel { transform-box: fill-box; transform-origin: center; animation: turn 30s linear infinite; }
@keyframes turn { to { transform: rotate(360deg); } }
.coin-up { animation: coinUp 7s ease-in infinite; }
@keyframes coinUp { 0% { transform: translateY(0); opacity: 0; } 15% { opacity: 1; } 100% { transform: translateY(-200px); opacity: 0; } }
.spark { animation: twinkle 3s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes twinkle { 0%, 100% { opacity: .1; transform: scale(.5); } 50% { opacity: 1; transform: scale(1); } }
.shine { animation: shine 5s ease-in-out infinite; }
@keyframes shine { 0%, 100% { opacity: .25; } 50% { opacity: .7; } }
.fore { filter: blur(2.2px); }
.fern { transform-box: fill-box; transform-origin: 50% 100%; animation: sway 7s ease-in-out infinite; }


/* Fondo de las diapositivas interiores */
.bg { position: absolute; inset: 0; background: radial-gradient(ellipse 60% 55% at 78% 18%, rgba(245, 196, 81, .16), transparent 70%), radial-gradient(ellipse 70% 60% at 10% 100%, rgba(16, 185, 129, .2), transparent 70%), linear-gradient(170deg, #0b2a20, #061a12 60%, #04100a); }
.bg svg { position: absolute; left: 0; right: 0; bottom: 0; width: 100%; height: 300px; opacity: .55; }
.bg .glow { position: absolute; width: 520px; height: 520px; right: -120px; top: -160px; border-radius: 50%; background: radial-gradient(circle, rgba(255, 226, 168, .22), transparent 65%); animation: breathe 7s ease-in-out infinite; }
@keyframes breathe { 50% { transform: scale(1.12); opacity: .7; } }
.content { position: absolute; inset: 0; padding: 70px 110px 110px; display: flex; flex-direction: column; justify-content: center; }
.kicker { display: inline-flex; align-items: center; gap: 12px; font-family: var(--font-brand); font-size: 15px; font-weight: 700; letter-spacing: .2em; text-transform: uppercase; color: var(--mint); }
.kicker::before { content: ""; width: 34px; height: 2px; background: linear-gradient(90deg, var(--gold), var(--mint)); }
.title { font-family: var(--font-brand); font-weight: 700; font-size: 60px; line-height: 1.06; letter-spacing: -.025em; margin: 18px 0 0; max-width: 20ch; text-wrap: balance; }
.title .gold { background: linear-gradient(100deg, #ffe9b0, var(--gold) 50%, #d99a2b); -webkit-background-clip: text; background-clip: text; color: transparent; }
.title .mint { background: linear-gradient(100deg, var(--mint-soft), var(--emerald)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.lead { font-size: 21px; line-height: 1.55; color: var(--on-dark-soft); max-width: 56ch; margin: 18px 0 0; }
.foot { position: absolute; left: 110px; right: 110px; bottom: 38px; display: flex; justify-content: space-between; align-items: center; font-size: 14px; color: var(--on-dark-soft); letter-spacing: .04em; }
.foot b { color: var(--on-dark); font-family: var(--font-brand); }

/* Entrada escalonada de cada diapositiva */
.in { animation: inUp .8s cubic-bezier(.2, .8, .2, 1) both; animation-delay: calc(var(--i, 0) * 90ms + 120ms); }
@keyframes inUp { from { opacity: 0; transform: translateY(34px) scale(.98); filter: blur(6px); } to { opacity: 1; transform: none; filter: none; } }
.pop { animation: pop .7s cubic-bezier(.2, 1.4, .4, 1) both; animation-delay: calc(var(--i, 0) * 80ms + 300ms); }
@keyframes pop { from { opacity: 0; transform: scale(.6) rotate(-4deg); } to { opacity: 1; transform: none; } }

/* Tarjetas genéricas */
.glass.ant-card { background: linear-gradient(160deg, rgba(17, 51, 36, .78), rgba(10, 33, 23, .66)); border: 1px solid var(--line); border-radius: 24px; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); transition: transform .4s cubic-bezier(.2, .8, .2, 1), border-color .4s, box-shadow .4s; }
.glass.ant-card:hover { transform: translateY(-8px); border-color: rgba(110, 231, 183, .4); box-shadow: 0 30px 60px -30px rgba(0, 0, 0, .9), 0 0 0 1px rgba(110, 231, 183, .1); }
.glass .ant-card-body { padding: 30px; }
.ico { width: 58px; height: 58px; border-radius: 18px; display: grid; place-items: center; font-size: 26px; color: var(--mint); background: rgba(110, 231, 183, .1); border: 1px solid rgba(110, 231, 183, .2); margin-bottom: 20px; transition: transform .5s cubic-bezier(.2, 1.4, .4, 1); }
.ico.g { color: var(--gold); background: rgba(245, 196, 81, .1); border-color: rgba(245, 196, 81, .25); }
.glass.ant-card:hover .ico { transform: rotate(-8deg) scale(1.1); }
.card-h { font-family: var(--font-brand); font-size: 24px; font-weight: 700; margin: 0 0 8px; color: #fff; }
.card-p { font-size: 17px; line-height: 1.5; color: var(--on-dark-soft); margin: 0; }

/* 02: propuesta + tarjeta de partículas */
.s2 { display: grid; grid-template-columns: 1fr 640px; gap: 40px; align-items: center; flex: 1; }
.s2 .list { display: grid; gap: 16px; margin-top: 34px; }
.s2 .row.ant-card .ant-card-body { display: flex; gap: 20px; align-items: center; padding: 22px 26px; }
.s2 .row .ico { margin: 0; flex: none; }
.card3d { position: relative; width: 640px; height: 520px; perspective: 1400px; display: grid; place-items: center; }
.card3d canvas { width: 640px; height: 460px; animation: tilt 7s ease-in-out infinite alternate, floaty 6s ease-in-out infinite; transform-style: preserve-3d; }
@keyframes tilt { from { transform: rotateY(-22deg) rotateX(14deg) rotateZ(-6deg); } to { transform: rotateY(18deg) rotateX(-8deg) rotateZ(3deg); } }
@keyframes floaty { 50% { translate: 0 -14px; } }
.card3d .shadow { position: absolute; bottom: 30px; width: 380px; height: 40px; border-radius: 50%; background: radial-gradient(ellipse, rgba(0, 0, 0, .7), transparent 70%); filter: blur(8px); animation: shadowpulse 6s ease-in-out infinite; }
@keyframes shadowpulse { 50% { transform: scale(.86); opacity: .7; } }
.card3d .halo { position: absolute; width: 560px; height: 560px; border-radius: 50%; background: radial-gradient(circle, rgba(16, 185, 129, .22), transparent 62%); }

/* 03: servicios */
.grid8 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-top: 44px; }
.grid8 .ant-card-body { padding: 32px 28px !important; }
.svc.ant-card .ant-card-body { padding: 26px; height: 100%; }
.svc .card-h { font-size: 21px; }
.svc .card-p { font-size: 16px; }
.svc { position: relative; overflow: hidden; }
.svc::after { content: ""; position: absolute; inset: 0; border-radius: 24px; background: radial-gradient(420px circle at var(--x, 50%) var(--y, -20%), rgba(110, 231, 183, .16), transparent 45%); pointer-events: none; }

/* 04: transferencias */
.s4 { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; margin-top: 40px; align-items: stretch; }
.steps.ant-card .ant-card-body { padding: 34px 36px; }
.steps .ant-steps-item-title { font-size: 23px !important; font-weight: 600; color: #fff !important; }
.steps .ant-steps-item-description { font-size: 16px !important; color: var(--on-dark-soft) !important; }
.steps .ant-steps-item { padding-bottom: 26px; }
.steps .ant-steps-item-icon .anticon { font-size: 26px; }
.inter.ant-card { background: linear-gradient(160deg, #0f3a2a, #0a2117); }
.net { width: 100%; height: auto; margin: 14px 0 10px; }
.pkt { offset-path: path("M90 120 C 210 20, 350 20, 470 120"); animation: travel 2.8s cubic-bezier(.6, 0, .4, 1) infinite; }
.pkt.b { offset-path: path("M470 120 C 350 220, 210 220, 90 120"); animation-delay: 1.4s; }
@keyframes travel { 0% { offset-distance: 0%; opacity: 0; } 12% { opacity: 1; } 88% { opacity: 1; } 100% { offset-distance: 100%; opacity: 0; } }

/* 05: inversiones */
.ticker { margin-top: 32px; overflow: hidden; mask-image: linear-gradient(90deg, transparent, #000 8%, #000 92%, transparent); -webkit-mask-image: linear-gradient(90deg, transparent, #000 8%, #000 92%, transparent); }
.ticker-track { display: flex; gap: 12px; width: max-content; animation: marquee 26s linear infinite; }
@keyframes marquee { to { transform: translateX(-50%); } }
.tick { display: flex; gap: 10px; padding: 10px 18px; border-radius: 999px; border: 1px solid var(--line); background: rgba(167, 243, 208, .04); font-size: 16px; white-space: nowrap; }
.tick b { font-family: var(--font-brand); } .up { color: var(--mint); } .down { color: #f39a8f; }
.inv { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-top: 24px; }
.chart { width: 100%; height: 150px; margin-top: 20px; overflow: visible; }
.chart .l { fill: none; stroke: var(--mint); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 700; animation: draw 2.4s cubic-bezier(.4, 0, .2, 1) .6s both; }
.chart .a { fill: url(#area); opacity: 0; animation: fadeIn 1s ease 1.6s both; }
.chart .end { fill: var(--gold); animation: pop .5s ease 2.8s both; transform-box: fill-box; transform-origin: center; }
@keyframes draw { from { stroke-dashoffset: 700; } to { stroke-dashoffset: 0; } }
@keyframes fadeIn { to { opacity: 1; } }
.banner { margin-top: 22px; display: flex; align-items: center; gap: 18px; padding: 20px 26px; border-radius: 20px; background: linear-gradient(100deg, rgba(245, 196, 81, .16), rgba(16, 185, 129, .08)); border: 1px solid rgba(245, 196, 81, .3); font-size: 18px; }
.banner b { color: var(--gold-soft); font-family: var(--font-brand); }

/* 06: préstamos */
.s6 { display: grid; grid-template-columns: 1.1fr .9fr; gap: 30px; margin-top: 36px; }
.sim.ant-card { background: linear-gradient(160deg, #fffaf0, #f2efe2); border: 0; }
.sim.ant-card .ant-card-body { padding: 34px 38px; }
.sim .ant-statistic-title { color: #4a5c52 !important; font-size: 16px; }
.sim .ant-statistic-content { font-family: var(--font-brand); font-weight: 700; color: #17694a !important; }
.sim .big .ant-statistic-content { font-size: 56px !important; }
.sim .ant-segmented { margin-top: 14px; }
.sim .ant-segmented-item-label { padding: 10px 0; font-size: 17px; line-height: 1.25; }
.sim .ant-segmented-item-label small { display: block; font-size: 12px; opacity: .75; }
.sim .outs { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 22px; padding-top: 20px; border-top: 1px dashed rgba(16, 38, 28, .2); }
.rules { display: grid; gap: 16px; }
.rule { border-radius: 20px; padding: 24px 28px; background: rgba(17, 51, 36, .7); border: 1px solid var(--line); display: flex; gap: 18px; align-items: flex-start; transition: transform .35s; }
.rule:hover { transform: translateX(8px); }
.rule .ico { margin: 0; flex: none; width: 50px; height: 50px; font-size: 22px; }
.rule h3 { margin: 0 0 4px; font-family: var(--font-brand); font-size: 21px; color: var(--mint-soft); }
.rule p { margin: 0; font-size: 16px; color: var(--on-dark-soft); line-height: 1.5; }

/* 07: seguridad */
.sec4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; margin-top: 40px; }
.shinewrap { border-radius: 24px; padding: 1.5px; background: conic-gradient(from var(--a, 0deg), transparent 0 68%, rgba(110, 231, 183, .9) 78%, rgba(245, 196, 81, .9) 84%, transparent 92%); animation: rot 5s linear infinite; }
.shinewrap:nth-child(2) { animation-delay: -1.25s; } .shinewrap:nth-child(3) { animation-delay: -2.5s; } .shinewrap:nth-child(4) { animation-delay: -3.75s; }
@property --a { syntax: '<angle>'; inherits: false; initial-value: 0deg; }
@keyframes rot { to { --a: 360deg; } }
.shinewrap > div { height: 100%; border-radius: 23px; background: #0c271b; padding: 30px; }
.lockbig { display: flex; gap: 26px; align-items: center; margin-top: 24px; padding: 24px 30px; border-radius: 22px; background: rgba(4, 16, 10, .7); border: 1px solid var(--line); }
.lockbig .ant-progress-text { color: #fff !important; font-family: var(--font-brand); font-weight: 700; }

/* 08: integridad */
.s8 { display: grid; grid-template-columns: 1fr 1fr; gap: 26px; margin-top: 36px; }
.tl .ant-timeline-item-content { font-family: ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace; font-size: 17px; color: #e8f4ed !important; }
.tl .ant-timeline-item { padding-bottom: 18px; animation: inUp .6s ease both; }
.tl .ant-timeline-item:nth-child(1) { animation-delay: .7s; } .tl .ant-timeline-item:nth-child(2) { animation-delay: 1.1s; } .tl .ant-timeline-item:nth-child(3) { animation-delay: 1.5s; } .tl .ant-timeline-item:nth-child(4) { animation-delay: 1.9s; }
.ops { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 24px; }
.ops .ant-tag { font-size: 15px; padding: 6px 14px; border-radius: 999px; }

/* 09: administración */
.s9 { display: grid; grid-template-columns: 1.1fr .9fr; gap: 26px; margin-top: 36px; }
.checks { display: grid; gap: 14px; margin-top: 6px; }
.check { display: flex; align-items: center; gap: 14px; font-size: 19px; padding: 14px 18px; border-radius: 14px; background: rgba(4, 16, 10, .45); border: 1px solid var(--line); }
.check .anticon { color: var(--mint); font-size: 20px; }
.check .anticon.no { color: #f39a8f; }
.vault.ant-card { background: radial-gradient(ellipse 80% 60% at 70% 0%, rgba(245, 196, 81, .2), transparent 70%), linear-gradient(160deg, #123d2c, #071a12); }
.roles3 { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 18px; }
.roles3 .ant-tag { font-size: 15px; padding: 6px 14px; border-radius: 999px; }

/* Portada y cierre */
.cover-ui { position: absolute; inset: 0; pointer-events: none; }
.cover-top { position: absolute; top: 46px; left: 0; right: 0; text-align: center; }
.cover-top .wm { display: inline-flex; align-items: center; gap: 12px; font-family: var(--font-brand); font-weight: 700; letter-spacing: .34em; font-size: 22px; color: #fff; animation: fade 1.2s ease .4s both; }
.cover-top .wm svg { width: 40px; height: 40px; }
.cover-top p { margin: 10px 0 0; font-size: 14px; letter-spacing: .3em; text-transform: uppercase; color: var(--cream); opacity: .85; animation: fade 1.2s ease .6s both; }
.cover-bottom { position: absolute; left: 70px; right: 70px; bottom: 44px; display: flex; justify-content: space-between; align-items: flex-end; pointer-events: auto; }
.team { display: flex; gap: 10px; flex-wrap: wrap; animation: fade 1.2s ease 2.2s both; }
.team .ant-tag { font-size: 15px; padding: 6px 14px; border-radius: 999px; background: rgba(4, 16, 10, .55); border: 1px solid rgba(255, 241, 214, .25); color: #fff; backdrop-filter: blur(6px); }
.qrbox { display: flex; gap: 14px; align-items: center; padding: 12px 18px 12px 12px; border-radius: 20px; background: rgba(4, 16, 10, .6); border: 1px solid rgba(255, 241, 214, .2); backdrop-filter: blur(8px); animation: fade 1.2s ease 2.4s both; }
.qrbox .ant-qrcode { background: #fff !important; padding: 6px !important; border: 0 !important; }
.qrbox small { display: block; color: var(--on-dark-soft); font-size: 13px; }
.qrbox b { font-family: var(--font-brand); font-size: 16px; }
.cover-lead { position: absolute; left: 0; right: 0; top: 118px; text-align: center; font-family: var(--font-brand); font-size: 22px; color: #fff; text-shadow: 0 2px 20px rgba(0, 0, 0, .6); animation: fade 1.4s ease 1.8s both; }
.cover-lead span { color: var(--gold-soft); }

/* Controles */
.controls { position: fixed; z-index: 30; left: 50%; bottom: max(14px, env(safe-area-inset-bottom, 0px)); translate: -50% 0; display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 999px; background: rgba(4, 16, 10, .72); border: 1px solid var(--line); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); opacity: .25; transition: opacity .3s; }
.controls:hover, .controls:focus-within { opacity: 1; }
.dots { display: flex; gap: 6px; padding: 0 6px; }
.dots button { width: 9px; height: 9px; border-radius: 999px; border: 0; padding: 0; background: rgba(167, 243, 208, .3); cursor: pointer; transition: width .35s, background .35s; }
.dots button.on { width: 26px; background: var(--mint); }
.counter { font-variant-numeric: tabular-nums; font-size: 13px; color: var(--on-dark-soft); min-width: 44px; text-align: center; }
.progress { position: fixed; z-index: 30; top: 0; left: 0; height: 3px; background: linear-gradient(90deg, var(--gold), var(--mint)); transition: width .5s cubic-bezier(.2, .8, .2, 1); }
.hint { position: fixed; z-index: 30; right: 16px; top: 12px; font-size: 12px; color: var(--on-dark-soft); opacity: .6; }
.notes-text { font-size: 16px; line-height: 1.6; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>


<div id="root"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dayjs@1.11.13/dayjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/antd@5.21.6/dist/antd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@ant-design/icons@5.5.1/dist/index.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.umd.js"></script>
<script>
(function () {
const { useState, useEffect, useRef, useCallback } = React;
const html = htm.bind(React.createElement);

/* Generador determinístico (misma escena en cada carga) */
function rng(seed) { let s = seed; return () => { s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; }; }

/* Pino con ramas irregulares: silueta orgánica en lugar de triángulos */
function pinePath(x, base, h, w, seed) {
  const r = rng(seed), tiers = 8, step = (h * 0.9) / tiers, right = [], left = [];
  for (let i = 0; i < tiers; i++) {
    const y = base - h + step * (i + 1);
    const hw = (w / 2) * Math.pow((i + 1) / tiers, 0.85) * (0.9 + r() * 0.2);
    const droop = step * (0.25 + r() * 0.2);
    right.push(`${(x + hw).toFixed(1)},${(y + droop).toFixed(1)}`, `${(x + hw * (0.35 + r() * 0.15)).toFixed(1)},${(y - step * 0.12).toFixed(1)}`);
    left.push(`${(x - hw * (0.35 + r() * 0.15)).toFixed(1)},${(y - step * 0.12).toFixed(1)}`, `${(x - hw * (0.95 + r() * 0.1)).toFixed(1)},${(y + droop).toFixed(1)}`);
  }
  const tw = Math.max(3, w * 0.06);
  return `M${x},${base - h} L${right.join(' L')} L${x + tw},${base - h * 0.08} L${x + tw},${base} L${x - tw},${base} L${x - tw},${base - h * 0.08} L${left.reverse().join(' L')} Z`;
}

function Forest({ trees, fill, seed, cls }) {
  return html`<g className=${cls}>${trees.map(([x, base, h, w], i) => html`<path key=${i} className="sway" style=${{ animationDelay: -i * 0.9 + 's', animationDuration: 7 + (i % 4) + 's' }} d=${pinePath(x, base, h, w, seed + i * 31)} fill=${typeof fill === 'function' ? fill(x) : fill} />`)}</g>`;
}

/* Helecho de primer plano: hojitas a los dos lados de un tallo curvo */
function Fern({ x, base, h, dir, i }) {
  const n = 14, items = [];
  for (let k = 1; k <= n; k++) {
    const t = k / n, cx = x + dir * h * 0.5 * t * t, cy = base - h * t;
    const ang = Math.atan2(-h, dir * h * t) * 180 / Math.PI;
    const len = h * 0.13 * (1 - t * 0.75);
    [1, -1].forEach((side) => items.push(html`<ellipse key=${k + '' + side} cx=${cx} cy=${cy} rx=${len} ry=${len * 0.32} transform=${`rotate(${ang + side * 62} ${cx} ${cy}) translate(${len * 0.8} 0)`} fill="#061a10" />`));
  }
  return html`<g className="fern" style=${{ animationDelay: -i + 's' }}><path d=${`M${x},${base} Q ${x + dir * h * 0.12},${base - h * 0.5} ${x + dir * h * 0.5},${base - h}`} fill="none" stroke="#061a10" strokeWidth="5" strokeLinecap="round" />${items}</g>`;
}

/* ---------- Tarjeta de Tree Bank que se arma y se desarma en partículas ---------- */
function drawCard(ctx, W, H) {
  const r = 30;
  ctx.save();
  ctx.beginPath(); ctx.roundRect(0, 0, W, H, r); ctx.clip();
  const g = ctx.createLinearGradient(0, 0, W, H); g.addColorStop(0, '#163f30'); g.addColorStop(.45, '#0d2a1f'); g.addColorStop(1, '#06160f'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // anillos de árbol: el veteado de la tarjeta
  const cx = W * .78, cy = H * .62;
  for (let i = 0; i < 22; i++) {
    ctx.beginPath();
    for (let a = 0; a <= Math.PI * 2 + .05; a += .06) {
      const rr = 18 + i * 17 + Math.sin(a * 5 + i * .7) * (3 + i * .5) + Math.cos(a * 3 - i) * 4;
      const x = cx + Math.cos(a) * rr * 1.25, y = cy + Math.sin(a) * rr * .85;
      a === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }
    ctx.strokeStyle = i % 5 === 0 ? 'rgba(245,196,81,.32)' : 'rgba(167,243,208,' + (.08 + (i % 3) * .05) + ')';
    ctx.lineWidth = i % 5 === 0 ? 2.2 : 1.6; ctx.stroke();
  }
  const sh = ctx.createLinearGradient(0, 0, W, H); sh.addColorStop(.25, 'rgba(255,255,255,0)'); sh.addColorStop(.42, 'rgba(255,255,255,.14)'); sh.addColorStop(.5, 'rgba(255,255,255,0)'); ctx.fillStyle = sh; ctx.fillRect(0, 0, W, H);
  // logo
  const tree = (x, y, s, c) => { ctx.fillStyle = c; ctx.beginPath(); ctx.moveTo(x, y - s); ctx.lineTo(x + s * .55, y); ctx.lineTo(x - s * .55, y); ctx.closePath(); ctx.fill(); };
  tree(40, 64, 24, '#34d399'); tree(58, 66, 34, '#6ee7b7'); tree(76, 64, 24, '#34d399');
  ctx.fillStyle = '#6ee7b7'; ctx.fillRect(28, 68, 60, 3);
  ctx.fillStyle = '#f2fff8'; ctx.font = '700 22px Sora, Inter, sans-serif'; ctx.fillText('TREE BANK', 100, 62);
  ctx.fillStyle = 'rgba(232,244,237,.6)'; ctx.font = '500 13px Inter, sans-serif'; ctx.fillText('Tu banco, tu naturaleza', 101, 82);
  // chip
  const chip = ctx.createLinearGradient(40, 130, 110, 185); chip.addColorStop(0, '#ffe9b0'); chip.addColorStop(.5, '#f5c451'); chip.addColorStop(1, '#b8860b');
  ctx.fillStyle = chip; ctx.beginPath(); ctx.roundRect(40, 128, 70, 54, 10); ctx.fill();
  ctx.strokeStyle = 'rgba(120,80,10,.55)'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(40, 146); ctx.lineTo(110, 146); ctx.moveTo(40, 164); ctx.lineTo(110, 164); ctx.moveTo(75, 128); ctx.lineTo(75, 182); ctx.stroke();
  // sin contacto
  ctx.strokeStyle = 'rgba(242,255,248,.75)'; ctx.lineWidth = 3;
  for (let i = 0; i < 3; i++) { ctx.beginPath(); ctx.arc(128, 155, 10 + i * 8, -.7, .7); ctx.stroke(); }
  // número y datos
  ctx.fillStyle = '#f2fff8'; ctx.font = '600 30px "SFMono-Regular", Menlo, Consolas, monospace'; ctx.fillText('4556  3224  5470  2026', 40, 248);
  ctx.fillStyle = 'rgba(232,244,237,.6)'; ctx.font = '600 11px Inter, sans-serif'; ctx.fillText('TITULAR', 40, 288); ctx.fillText('VENCE', 330, 288);
  ctx.fillStyle = '#f2fff8'; ctx.font = '600 18px Inter, sans-serif'; ctx.fillText('CLIENTE TREE BANK', 40, 312); ctx.fillText('10/31', 330, 312);
  ctx.fillStyle = '#f5c451'; ctx.font = '800 26px Sora, sans-serif'; ctx.textAlign = 'right'; ctx.fillText('DÉBITO', W - 34, 312); ctx.textAlign = 'left';
  ctx.restore();
  ctx.strokeStyle = 'rgba(167,243,208,.35)'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.roundRect(.75, .75, W - 1.5, H - 1.5, r); ctx.stroke();
}

function ParticleCard() {
  const ref = useRef(null);
  useEffect(() => {
    const cv = ref.current; if (!cv) return;
    const dpr = Math.min(2, window.devicePixelRatio || 1), CW = 640, CH = 460, W = 520, H = 330, OX = (CW - W) / 2, OY = (CH - H) / 2;
    cv.width = CW * dpr; cv.height = CH * dpr; const ctx = cv.getContext('2d'); ctx.scale(dpr, dpr);
    const off = document.createElement('canvas'); off.width = W; off.height = H; const oc = off.getContext('2d');
    let pts = [], raf, t0 = performance.now();
    const build = () => {
      oc.clearRect(0, 0, W, H); drawCard(oc, W, H);
      const data = oc.getImageData(0, 0, W, H).data; pts = [];
      const step = 4;
      for (let y = 0; y < H; y += step) for (let x = 0; x < W; x += step) {
        const k = (y * W + x) * 4; if (data[k + 3] < 40) continue;
        const ang = Math.random() * Math.PI * 2, rad = 160 + Math.random() * 260;
        pts.push({ tx: OX + x, ty: OY + y, sx: OX + W * 1.1 + Math.cos(ang) * rad * .6, sy: OY + H / 2 + Math.sin(ang) * rad * .7, c: `rgb(${data[k]},${data[k + 1]},${data[k + 2]})`, d: (x / W) * .55 + Math.random() * .2, n: Math.random() * 6.28 });
      }
    };
    (document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(build); build();
    const ease = (t) => (t < 0 ? 0 : t > 1 ? 1 : 1 - Math.pow(1 - t, 3));
    const LOOP = 10;
    const frame = (now) => {
      const t = ((now - t0) / 1000) % LOOP;
      ctx.clearRect(0, 0, CW, CH);
      // 0-2.6 se arma · 2.6-3.1 aparece la tarjeta · 3.1-7.2 tarjeta · 7.2-9.4 se desarma
      if (t > 2.6 && t < 7.6) {
        const a = Math.min(1, (t - 2.6) / .5) * (t > 7.2 ? 1 - (t - 7.2) / .4 : 1);
        ctx.globalAlpha = a; ctx.drawImage(off, OX, OY, W, H); ctx.globalAlpha = 1;
      }
      if (t < 3.1 || t > 7.2) {
        for (let i = 0; i < pts.length; i++) {
          const p = pts[i]; let x, y, alpha = 1, col = p.c;
          if (t < 3.1) {
            const k = ease((t - p.d * 1.4) / 1.3);
            x = p.sx + (p.tx - p.sx) * k + Math.sin(now / 400 + p.n) * 6 * (1 - k); y = p.sy + (p.ty - p.sy) * k + Math.cos(now / 500 + p.n) * 6 * (1 - k);
            alpha = t > 2.6 ? 1 - (t - 2.6) / .5 : Math.min(1, k * 1.6 + .15); if (k < .7) col = k < .35 ? '#6ee7b7' : col;
          } else {
            const k = ease((t - 7.2 - (1 - p.d) * 1.1) / 1.6);
            x = p.tx - k * (180 + p.n * 20) + Math.sin(now / 300 + p.n) * 10 * k; y = p.ty - k * (60 + p.n * 14) + Math.cos(now / 380 + p.n) * 8 * k;
            alpha = (1 - k) * (t < 7.6 ? (t - 7.2) / .4 : 1); col = k > .25 ? '#6ee7b7' : col;
          }
          if (alpha <= .02) continue;
          ctx.globalAlpha = alpha; ctx.fillStyle = col; ctx.fillRect(x, y, 2.6, 2.6);
        }
        ctx.globalAlpha = 1;
      }
      raf = requestAnimationFrame(frame);
    };
    raf = requestAnimationFrame(frame);
    return () => cancelAnimationFrame(raf);
  }, []);
  return html`<div className="card3d in" style=${{ '--i': 2 }}><div className="halo"></div><canvas ref=${ref} role="img" aria-label="Tarjeta de débito de Tree Bank que se forma a partir de partículas verdes y vuelve a deshacerse"></canvas><div className="shadow"></div></div>`;
}

  [Integridad, 'Cubre transferencias, depósitos, préstamos, tarjetas, seguros, inversiones, cambio de divisas, pagos y recargas. Detalle técnico: transacciones de base de datos (BEGIN, COMMIT, ROLLBACK) y descuento en una sola sentencia con condición de saldo, lo que evita la condición de carrera.'],
  [Administracion, 'Visibilidad y control sin riesgos para quien administra el banco. El rol de administrador solo lo asigna el equipo técnico en el servidor. Bloquear es reversible; eliminar es irreversible y se rechaza si hay saldo o deudas. El rol empleado (soporte) solo consulta y atiende reportes.'],
  [Cierre, 'Cerrar con la propuesta en una línea y pasar a la demostración o a las preguntas. Cada cambio se publica automáticamente en 1 a 3 minutos, sobre servicios gratuitos (Netlify, Render y Supabase). Antes de una demostración en vivo, despertar el servidor de Render: se suspende a los 15 minutos sin tráfico.'],
];

function readHash() { const m = /^#s(\d+)$/.exec(location.hash || ''); const n = m ? parseInt(m[1], 10) - 1 : 0; return n >= 0 && n < SLIDES.length ? n : 0; }

function Deck() {
  const [i, setI] = useState(readHash);
  const [scale, setScale] = useState(1);
  const [notes, setNotes] = useState(false);
  const go = useCallback((n) => setI((cur) => { const v = Math.max(0, Math.min(SLIDES.length - 1, typeof n === 'function' ? n(cur) : n)); try { history.replaceState(null, '', '#s' + (v + 1)); } catch (e) {} return v; }), []);
  useEffect(() => {
    const fit = () => setScale(Math.min(innerWidth / 1600, innerHeight / 900));
    fit(); addEventListener('resize', fit);
    const key = (e) => {
      if (e.target && /INPUT|TEXTAREA/.test(e.target.tagName)) return;
      if (['ArrowRight', 'PageDown', ' ', 'Enter'].includes(e.key)) { e.preventDefault(); go((c) => c + 1); }
      else if (['ArrowLeft', 'PageUp', 'Backspace'].includes(e.key)) { e.preventDefault(); go((c) => c - 1); }
      else if (e.key === 'Home') go(0); else if (e.key === 'End') go(SLIDES.length - 1);
      else if (e.key.toLowerCase() === 'n') setNotes((v) => !v);
      else if (e.key.toLowerCase() === 'f') { const d = document.documentElement; if (!document.fullscreenElement && d.requestFullscreen) d.requestFullscreen().catch(() => {}); else if (document.exitFullscreen) document.exitFullscreen().catch(() => {}); }
    };
    const hc = () => setI(readHash());
    addEventListener('keydown', key); addEventListener('hashchange', hc);
    return () => { removeEventListener('resize', fit); removeEventListener('keydown', key); removeEventListener('hashchange', hc); };
  }, [go]);
  const [S, note] = SLIDES[i];
  return html`<${ConfigProvider} theme=${{ algorithm: theme.darkAlgorithm, token: { colorPrimary: '#10b981', colorBgContainer: '#0d291d', colorText: '#e8f4ed', colorTextSecondary: '#a3bfb1', borderRadius: 14, fontFamily: "Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" } }}>
    <div className="progress" style=${{ width: ((i + 1) / SLIDES.length) * 100 + '%' }}></div>
    <div className="viewport"><div className="canvas" style=${{ transform: `translate(-50%, -50%) scale(${scale})` }}><${S} key=${i} /></div></div>
    <div className="controls">
      <${Tooltip} title="Anterior (←)"><${Button} shape="circle" type="text" icon=${html`<${I.LeftOutlined} />`} onClick=${() => go(i - 1)} disabled=${i === 0} aria-label="Diapositiva anterior" /></${Tooltip}>
      <div className="dots">${SLIDES.map((_, k) => html`<button key=${k} className=${k === i ? 'on' : ''} onClick=${() => go(k)} aria-label=${'Ir a la diapositiva ' + (k + 1)}></button>`)}</div>
      <span className="counter">${i + 1} / ${SLIDES.length}</span>
      <${Tooltip} title="Siguiente (→)"><${Button} shape="circle" type="text" icon=${html`<${I.RightOutlined} />`} onClick=${() => go(i + 1)} disabled=${i === SLIDES.length - 1} aria-label="Diapositiva siguiente" /></${Tooltip}>
      <${Tooltip} title="Notas del orador (N)"><${Button} shape="circle" type="text" icon=${html`<${I.ProfileOutlined} />`} onClick=${() => setNotes(true)} aria-label="Ver notas del orador" /></${Tooltip}>
      <${Tooltip} title="Pantalla completa (F)"><${Button} shape="circle" type="text" icon=${html`<${I.FullscreenOutlined} />`} onClick=${() => { const d = document.documentElement; if (d.requestFullscreen) d.requestFullscreen().catch(() => {}); }} aria-label="Pantalla completa" /></${Tooltip}>
    </div>
    <${Drawer} title=${'Notas · diapositiva ' + (i + 1)} placement="bottom" height=${220} open=${notes} onClose=${() => setNotes(false)}><p className="notes-text">${note}</p></${Drawer}>
  </${ConfigProvider}>`;
}

ReactDOM.createRoot(document.getElementById('root')).render(html`<${Deck} />`);
})();
</script>

</body>
</html>
